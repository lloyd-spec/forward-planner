[build]
  publish = "."
  edge_functions = "netlify/edge-functions"

# Route the streaming endpoint to an edge function (no timeout when streaming)
[[edge_functions]]
  path = "/api/stream-ideas"
  function = "stream-ideas"

# Route the "develop this idea" endpoint to its edge function
[[edge_functions]]
  path = "/api/develop-idea"
  function = "develop-idea"
