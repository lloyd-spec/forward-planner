[build]
  publish = "."
  edge_functions = "netlify/edge-functions"

# The data hatch — read/write events, clients, settings, archive
[[edge_functions]]
  path = "/api/data"
  function = "data"

# The engine — generates, emails and archives the briefing (streams progress)
[[edge_functions]]
  path = "/api/run"
  function = "run-briefing"
